      <h1 data-i18n="beforeTrip.immigrationTitle">입국 준비·자동출입국심사 (SES)</h1>
      <div class="content-body" data-content-body data-body-path="beforeTrip.immigrationBody"></div>
      <div data-content-body-fallback>
        <p data-i18n="beforeTrip.immigration1">SES(Smart Entry Service)는 여권·지문·얼굴 정보로 전용 게이트를 통과하는 자동 출입국 심사입니다. 조건에 맞으면 사람 창구보다 빠른 경우가 많습니다.</p>
        <p data-i18n="beforeTrip.immigration2">등록외국인·일부 국적·사전등록자 등이 이용합니다. 등록 시 여권에 확인 도장 또는 SES 스티커가 붙을 수 있습니다.</p>
        <p data-i18n="beforeTrip.immigration3">대상·절차는 출입국·Hi Korea 등 공식 안내를 확인하세요.</p>
