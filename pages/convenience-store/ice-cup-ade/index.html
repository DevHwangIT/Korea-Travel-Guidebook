      <p class="article-lead" data-i18n="convenience.ice-cup-ade_lead">한국 편의점에서는 큰 얼음컵을 산 뒤, 같은 매장의 에이드·탄산·커피를 부어 마시는 조합이 유명합니다. 더운 날 관광 중에 시원하게 들고 다니기 좋아요.</p>
      <div class="tip">

        <p data-i18n="convenience.ice-cup-ade_tip">얼음컵은 계산대·냉동 코너에 있습니다. 에이드 원액은 너무 진하면 얼음이 녹으며 연해지니, 취향에 맞춰 양을 조절하세요. 매장 내 음료를 컵에 옮길 때 직원 안내를 따르는 것이 좋습니다.</p>
