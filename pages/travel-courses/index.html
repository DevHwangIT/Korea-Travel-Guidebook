<body>
  <nav class="lang-switch" aria-label="Language"></nav>
  <header class="site-header">
    <a href="../../index.html" class="site-brand" data-i18n="common.brand">Korea Travel Guide</a>
  </header>
  <main class="page">
    <p class="back-link"><a href="../../index.html" data-i18n="common.backMain">← Main Guide</a></p>
    <h1 data-i18n="travelCourses.title">여행 코스 추천</h1>
    <p class="article-lead" data-i18n="travelCourses.intro"></p>

    <div class="city-tabs prep-tabs tip-tabs travel-course-tabs" data-tabs="courseRegion" data-hash-tabs>
      <p class="travel-course-ia-label" data-i18n="travelCourses.regionPickLabel">지역</p>
      <label class="cat-select-wrap prep-cat-select-wrap">
        <span class="cat-select-label" data-i18n="travelCourses.regionPickLabel">지역</span>
        <select class="cat-select" data-courseRegion-select aria-label="Region">
          <option value="seoul" data-i18n="travelCourses.regionSeoul">서울</option>
          <option value="gyeonggi" data-i18n="travelCourses.regionGyeonggi">경기</option>
          <option value="incheon" data-i18n="travelCourses.regionIncheon">인천</option>
          <option value="gyeongju" data-i18n="travelCourses.regionGyeongju">경주</option>
          <option value="busan" data-i18n="travelCourses.regionBusan">부산</option>
          <option value="jeju" data-i18n="travelCourses.regionJeju">제주도</option>
        </select>
      </label>
      <div class="tab-list prep-cat-list" role="tablist" aria-label="Region">
        <button type="button" class="tab-btn is-active" role="tab" aria-selected="true" data-courseRegion-tab="seoul" data-i18n="travelCourses.regionSeoul">서울</button>
        <button type="button" class="tab-btn" role="tab" data-courseRegion-tab="gyeonggi" data-i18n="travelCourses.regionGyeonggi">경기</button>
        <button type="button" class="tab-btn" role="tab" data-courseRegion-tab="incheon" data-i18n="travelCourses.regionIncheon">인천</button>
        <button type="button" class="tab-btn" role="tab" data-courseRegion-tab="gyeongju" data-i18n="travelCourses.regionGyeongju">경주</button>
        <button type="button" class="tab-btn" role="tab" data-courseRegion-tab="busan" data-i18n="travelCourses.regionBusan">부산</button>
        <button type="button" class="tab-btn" role="tab" data-courseRegion-tab="jeju" data-i18n="travelCourses.regionJeju">제주도</button>
      </div>

      <div class="tab-panels">
        <div class="tab-panel guide-article tip-article is-active" role="tabpanel" data-courseRegion-panel="seoul">
          <div class="region-curated seoul-curated" data-region-curated="seoul"></div>
        </div>
        <div class="tab-panel guide-article tip-article" role="tabpanel" data-courseRegion-panel="gyeonggi" hidden>
          <div class="region-curated" data-region-curated="gyeonggi"></div>
        </div>
        <div class="tab-panel guide-article tip-article" role="tabpanel" data-courseRegion-panel="incheon" hidden>
          <div class="region-curated" data-region-curated="incheon"></div>
        </div>
        <div class="tab-panel guide-article tip-article" role="tabpanel" data-courseRegion-panel="gyeongju" hidden>
          <div class="region-curated" data-region-curated="gyeongju"></div>
        </div>
        <div class="tab-panel guide-article tip-article" role="tabpanel" data-courseRegion-panel="busan" hidden>
          <div class="region-curated" data-region-curated="busan"></div>
        </div>
        <div class="tab-panel guide-article tip-article" role="tabpanel" data-courseRegion-panel="jeju" hidden>
          <div class="region-curated" data-region-curated="jeju"></div>
        </div>
      </div>
    </div>

    <section class="course-quiz" data-course-quiz aria-label="Travel course recommendation quiz">
      <button type="button" class="course-quiz-banner" data-course-quiz-open>
        <span class="course-quiz-banner__glow" aria-hidden="true"></span>
        <span class="course-quiz-banner__copy">
          <span class="course-quiz-banner__eyebrow" data-i18n="travelCourses.quiz.bannerEyebrow">Live course</span>
          <span class="course-quiz-banner__title" data-course-quiz-banner-title data-i18n="travelCourses.quiz.bannerTitle">실시간으로 여행 코스를 추천받으세요.</span>
        </span>
        <span class="course-quiz-banner__cta" data-course-quiz-banner-cta data-i18n="travelCourses.quiz.bannerCta">추천받기</span>
      </button>

      <div class="course-quiz-dialog" data-course-quiz-dialog hidden role="dialog" aria-modal="true" aria-labelledby="course-quiz-heading">
        <div class="course-quiz-backdrop" data-course-quiz-backdrop tabindex="-1"></div>
        <div class="course-quiz-sheet">
          <div class="course-quiz-toolbar">
            <button type="button" class="course-quiz-back" data-course-quiz-back hidden data-i18n="travelCourses.quiz.back">이전</button>
            <h2 id="course-quiz-heading" class="course-quiz-heading" data-course-quiz-heading data-i18n="travelCourses.quiz.title">여행 코스 추천</h2>
            <div class="course-quiz-toolbar__end">
              <button type="button" class="course-quiz-save-icon" data-course-quiz-save hidden aria-label="저장하기" data-i18n-attr="aria-label:travelCourses.quiz.save;title:travelCourses.quiz.save">
                <svg class="course-quiz-save-icon__svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="course-quiz-save-icon__outline" d="M7 4h10a1 1 0 0 1 1 1v15.2a.8.8 0 0 1-1.24.67L12 17.5l-4.76 3.37A.8.8 0 0 1 6 20.2V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
                  <path class="course-quiz-save-icon__filled" d="M7 4h10a1 1 0 0 1 1 1v15.2a.8.8 0 0 1-1.24.67L12 17.5l-4.76 3.37A.8.8 0 0 1 6 20.2V5a1 1 0 0 1 1-1z" fill="currentColor" stroke="none"/>
                </svg>
              </button>
              <button type="button" class="course-quiz-close" data-course-quiz-close aria-label="Close" data-i18n-attr="aria-label:travelCourses.quiz.close">×</button>
            </div>
          </div>
          <div class="course-quiz-progress-wrap">
            <div class="course-quiz-progress-track" aria-hidden="true">
              <div class="course-quiz-progress-bar" data-course-quiz-bar></div>
            </div>
            <p class="course-quiz-progress-label" data-course-quiz-progress role="progressbar" aria-valuemin="1" aria-valuenow="1" aria-valuemax="6">1 / 6</p>
          </div>
          <div class="course-quiz-panel" data-course-quiz-panel></div>
        </div>
      </div>

      <section class="course-saved" data-course-saved aria-live="polite"></section>
    </section>
  </main>
