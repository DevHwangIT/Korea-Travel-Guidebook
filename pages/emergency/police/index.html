      <h1 data-i18n="emergency.police">경찰</h1>
      <p class="emergency-number-label" data-i18n="emergency.number">번호</p>
      <p class="emergency-number-hero" data-i18n="emergency.policeNumber">112</p>
      <div class="content-body" data-content-body data-body-path="emergency.policeBody">
        <p class="content-body__text" data-baked-body="1">경찰(112)은 범죄·폭력·분실 신고, 위험 상황에서 도움을 요청할 때 사용합니다. 영어 응대가 가능한 경우가 있으니 침착하게 위치와 상황을 말하세요.</p>
      </div>
      <div hidden data-content-body-fallback>
        <p data-i18n="emergency.desc">생명이 위험한 응급은 112(경찰) 또는 119(화재·구급)로 바로 연락하세요. 여행 통역·안내는 1330, 비자·체류는 1345(평일), 비응급 의료 상담은 1339, 전화 통역 봉사는 1588-5644(BBB)를 이용할 수 있습니다.</p>
      </div>
