<!DOCTYPE html>
<html lang="ko" data-i18n-title="misc.shoppingTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <nav class="lang-switch" aria-label="Language">
    <button type="button" data-set-lang="ko">KR</button>
    <button type="button" data-set-lang="en">EN</button>
    <button type="button" data-set-lang="ja">JP</button>
  </nav>
  <header class="site-header">
    <a href="../../index.html" class="site-brand" data-i18n="common.brand">Korea Travel Guide</a>
  </header>
  <main class="page">
    <p class="back-link"><a href="../../index.html" data-i18n="common.backMain">← Main Guide</a></p>
    <h1 data-i18n="misc.shoppingTitle">쇼핑 가이드</h1>
    <p data-i18n="shopping.intro"></p>

    <div class="city-tabs" data-tabs="shop">
      <div class="tab-list" role="tablist">
        <button type="button" class="tab-btn" role="tab" data-shop-tab="beauty" data-i18n="shopping.catBeauty"></button>
        <button type="button" class="tab-btn" role="tab" data-shop-tab="daily" data-i18n="shopping.catDaily"></button>
        <button type="button" class="tab-btn" role="tab" data-shop-tab="duty" data-i18n="shopping.catDuty"></button>
        <button type="button" class="tab-btn" role="tab" data-shop-tab="market" data-i18n="shopping.catMarket"></button>
      </div>
      <div class="tab-panels">
        <div class="tab-panel tip-article" role="tabpanel" data-shop-panel="beauty" hidden>
          <h2 data-i18n="shopping.oliveTitle"></h2>
          <p data-i18n="shopping.olive1"></p>
          <p data-i18n="shopping.olive2"></p>
          <p data-i18n="shopping.olive3"></p>
        </div>
        <div class="tab-panel tip-article" role="tabpanel" data-shop-panel="daily" hidden>
          <h2 data-i18n="shopping.daisoTitle"></h2>
          <p data-i18n="shopping.daiso1"></p>
          <p data-i18n="shopping.daiso2"></p>
        </div>
        <div class="tab-panel tip-article" role="tabpanel" data-shop-panel="duty" hidden>
          <h2 data-i18n="shopping.dutyTitle"></h2>
          <p data-i18n="shopping.duty1"></p>
          <p data-i18n="shopping.duty2"></p>
        </div>
        <div class="tab-panel tip-article" role="tabpanel" data-shop-panel="market" hidden>
          <h2 data-i18n="shopping.marketTitle"></h2>
          <p data-i18n="shopping.market1"></p>
          <p data-i18n="shopping.market2"></p>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <hr>
    <img src="../../Images/cover/footer-korea.png" width="100%" alt="Korea Travel">
    <p class="footer-note" data-i18n="common.footer"></p>
  </footer>
  <script src="../../i18n/messages.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/region-tabs.js"></script>
</body>
</html>
