<!DOCTYPE html>
<html lang="ko" data-i18n-title="korean.pageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Useful Korean</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <nav class="lang-switch" aria-label="Language">
    <button type="button" data-set-lang="ko">KR</button>
    <button type="button" data-set-lang="en">EN</button>
    <button type="button" data-set-lang="ja">JP</button>
  </nav>
  <header class="site-header">
    <a href="../../index.html" class="site-brand" data-i18n="common.brand">Korea Travel Guide</a>
  </header>
  <main class="page">
    <p class="back-link"><a href="../../index.html" data-i18n="common.backMain">← Main Guide</a></p>
    <h1 data-i18n="korean.pageTitle">유용한 한국어</h1>
    <p data-i18n="korean.intro"></p>

    <div class="city-tabs" data-tabs="phrasecat">
      <div class="tab-list" role="tablist" aria-label="Phrase categories">
        <button type="button" class="tab-btn" role="tab" data-phrasecat-tab="daily" data-i18n="korean.catDaily">일상생활</button>
        <button type="button" class="tab-btn" role="tab" data-phrasecat-tab="restaurant" data-i18n="korean.catRestaurant">식당 이용</button>
        <button type="button" class="tab-btn" role="tab" data-phrasecat-tab="shopping" data-i18n="korean.catShopping">쇼핑</button>
        <button type="button" class="tab-btn" role="tab" data-phrasecat-tab="transport" data-i18n="korean.catTransport">교통</button>
        <button type="button" class="tab-btn" role="tab" data-phrasecat-tab="emergency" data-i18n="korean.catEmergency">응급·도움</button>
        <button type="button" class="tab-btn tab-btn-swear" role="tab" data-phrasecat-tab="swear" data-i18n="korean.catSwear">(금지) 욕설</button>
      </div>

      <div class="tab-panels">
        <div class="tab-panel" role="tabpanel" data-phrasecat-panel="daily" hidden>
          <ul class="phrase-list"></ul>
        </div>
        <div class="tab-panel" role="tabpanel" data-phrasecat-panel="restaurant" hidden>
          <ul class="phrase-list"></ul>
        </div>
        <div class="tab-panel" role="tabpanel" data-phrasecat-panel="shopping" hidden>
          <ul class="phrase-list"></ul>
        </div>
        <div class="tab-panel" role="tabpanel" data-phrasecat-panel="transport" hidden>
          <ul class="phrase-list"></ul>
        </div>
        <div class="tab-panel" role="tabpanel" data-phrasecat-panel="emergency" hidden>
          <ul class="phrase-list"></ul>
        </div>
        <div class="tab-panel" role="tabpanel" data-phrasecat-panel="swear" hidden>
          <div class="swear-warning tip">
            <h2 data-i18n="korean.swearWarningTitle">절대 사용하지 마세요</h2>
            <p data-i18n="korean.swearWarningBody"></p>
          </div>
          <ul class="phrase-list"></ul>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <hr>
    <img src="../../Images/cover/footer-korea.png" width="100%" alt="Korea Travel">
    <p class="footer-note" data-i18n="common.footer">© Korea Travel Guide</p>
  </footer>
  <script src="../../i18n/messages.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/region-tabs.js"></script>
  <script src="../../js/korean-phrases-data.js"></script>
  <script src="../../js/korean-phrases-ui.js"></script>
  <script src="../../js/phrase-audio.js"></script>
</body>
</html>
